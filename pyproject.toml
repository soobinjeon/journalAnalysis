[build-system]
requires = ["setuptools>=42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-agent"
version = "0.1.0"
description = "Research paper collection, organization, and analysis agent team"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
journal = "journal_agent.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
